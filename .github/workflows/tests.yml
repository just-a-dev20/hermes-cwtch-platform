name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes-ref: [main, v0.23.0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Build the Hermes test environment
        shell: bash
        # The way Hermes builds its own test environment (tests/AGENTS.md): uv.lock, not pip.
        run: |
          git clone --depth 1 --branch "${{ matrix.hermes-ref }}" https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent"
          python -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-venv" --group dev --group test
      - name: Run tests
        shell: bash
        run: |
          py="$RUNNER_TEMP/hermes-venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/hermes-venv/Scripts/python.exe"
          HERMES_AGENT_HOME="$RUNNER_TEMP/hermes-agent" "$py" -m pytest tests -q
